name: Build and Publish Step-UI Images

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # Build BACKEND (Go)
      # -----------------------------
      - name: Build backend Docker image
        run: |
          docker build \
            -f backend/Dockerfile \
            -t ghcr.io/davidpik/step-ui-backend:latest \
            backend

      # -----------------------------
      # Build FRONTEND (Next.js)
      # -----------------------------
      - name: Build frontend Docker image
        run: |
          docker build \
            -f frontend/Dockerfile \
            -t ghcr.io/davidpik/step-ui-frontend:latest \
            frontend

      # -----------------------------
      # Login to GHCR
      # -----------------------------
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: DavidPik
          password: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------
      # Push images
      # -----------------------------
      - name: Push backend image
        run: docker push ghcr.io/davidpik/step-ui-backend:latest

      - name: Push frontend image
        run: docker push ghcr.io/davidpik/step-ui-frontend:latest
