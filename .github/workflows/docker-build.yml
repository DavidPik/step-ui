name: Build and Publish step-ui Docker Images

on:
  push:
    branches: [ "master" ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      ###############################################
      # BACKEND IMAGE
      ###############################################
      - name: Build backend image
        run: |
          docker build \
            -t ghcr.io/davidpik/step-ui-backend:latest \
            ./backend

      - name: Push backend image
        run: |
          docker push ghcr.io/davidpik/step-ui-backend:latest

      ###############################################
      # FRONTEND IMAGE
      ###############################################
      - name: Build frontend image
        run: |
          docker build \
            -t ghcr.io/davidpik/step-ui-frontend:latest \
            ./frontend

      - name: Push frontend image
        run: |
          docker push ghcr.io/davidpik/step-ui-frontend:latest
