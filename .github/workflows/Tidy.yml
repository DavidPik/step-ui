name: Go Modules Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  tidy-and-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'
          cache: 'true'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Show Go version
        run: go version

      - name: Ensure go env
        run: |
          go env
          # Ensure module mode
          export GO111MODULE=on

      - name: Run go mod tidy
        id: tidy
        run: |
          # Run tidy and fail if it would change go.mod or go.sum
          go mod tidy
          git --no-pager diff --exit-code go.mod go.sum || (echo "go.mod or go.sum would be modified by go mod tidy. Please run 'go mod tidy' locally and commit changes." && exit 1)

      - name: Run go mod verify
        run: go mod verify

      - name: Optional lint and tests
        if: ${{ always() }}
        run: |
          # Optional checks - uncomment or adjust as needed
          # go vet ./...
          # go test ./...
          echo "Module tidy and verify completed"
