name: Simple Frontend Import Scan

on:
  workflow_dispatch:
  push:
    paths:
      - 'frontend/**'
      - 'src/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'next.config.js'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ripgrep
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ripgrep

      - name: Scan for suspicious imports
        run: |
          OUT=frontend-imports.txt
          echo "# Suspicious imports scan - generated $(date -u)" > "$OUT"
          echo "" >> "$OUT"

          # 1) imports using @ alias (e.g. import x from '@/utils')
          echo "## Imports using @/ alias" >> "$OUT"
          rg -n --hidden --glob '!node_modules' "from\s+['\"]@/|import\(['\"]@/" src frontend || true >> "$OUT"

          echo "" >> "$OUT"

          # 2) absolute imports starting with / (rare in Next projects)
          echo "## Absolute imports starting with /" >> "$OUT"
          rg -n --hidden --glob '!node_modules' "from\s+['\"]/|import\(['\"]/ " src frontend || true >> "$OUT"

          echo "" >> "$OUT"

          # 3) all import/export lines (for manual inspection)
          echo "## All import/export lines (for quick scan)" >> "$OUT"
          rg -n --hidden --glob '!node_modules' "^\s*(import|export).*from\s+['\"][^'\"]+['\"]|^\s*import\(['\"][^'\"]+['\"]\)" src frontend || true >> "$OUT"

          echo "" >> "$OUT"
          echo "Wrote results to $OUT"
          ls -l "$OUT"
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: frontend-imports
          path: frontend-imports.txt
