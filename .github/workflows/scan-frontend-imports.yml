name: Scan Frontend Imports

on:
  workflow_dispatch:
  push:
    paths:
      - 'frontend/**'
      - 'src/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'next.config.js'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ripgrep jq

