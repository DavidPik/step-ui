name: Scan Frontend Imports

on:
  workflow_dispatch:
  push:
    paths:
      - 'frontend/**'
      - 'src/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'next.config.js'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ripgrep jq

      - name: Install frontend deps (if present)
        run: |
          if [ -f package.json ]; then npm ci --no-audit --no-fund; fi
          if [ -f frontend/package.json ]; then (cd frontend && npm ci --no-audit --no-fund); fi

      - name: Scan imports inline and write JSON
        run: |
          set -euo pipefail
          OUT="frontend-imports.json"
          echo "[]" > "$OUT"

          # globs to scan
          GLOBS=( "src/**/*.ts" "src/**/*.tsx" "src/**/*.js" "src/**/*.jsx" "frontend/src/**/*.ts" "frontend/src/**/*.tsx" )

          tmp=$(mktemp)
          jq -n '[]' > "$OUT"

          shopt -s globstar nullglob
          for g in "${GLOBS[@]}"; do
            for file in $g; do
              # extract import/export lines
              rg --no-line-number --hidden --multiline --no-ignore -n --pcre2 "^\s*(import|export).*from\s+['\"][^'\"]+['\"]|^\s*import\(['\"][^'\"]+['\"]\)" "$file" \
                | while IFS= read -r line; do
                    # capture module path
                    if [[ $line =~ from[[:space:]]+[\'\"]([^\'\"]+)[\'\"] ]]; then
                      mod="${BASH_REMATCH[1]}"
                    elif [[ $line =~ import\([\'\"]([^\'\"]+)[\'\"]\) ]]; then
                      mod="${BASH_REMATCH[1]}"
                    else
                      continue
                    fi

                    reason=""
                    report=false

                    if [[ "$mod" == @/* || "$mod" == @* ]]; then
                      report=true
                      reason="alias-@"
                    elif [[ "$mod" == /* || "$mod" == ../* || "$mod" == ./* ]]; then
                      target="$(dirname "$file")/$mod"
                      found=false
                      for ext in "" ".ts" ".tsx" ".js" ".jsx" "/index.ts" "/index.tsx" "/index.js" "/index.jsx"; do
                        if [ -e "${target}${ext}" ]; then
                          found=true
                          break
                        fi
                      done
                      if [ "$found" = false ]; then
                        report=true
                        reason="missing-relative"
                      fi
                    else
                      # check node resolution (works if node_modules installed)
                      if ! node -e "try{require.resolve('$mod'); process.exit(0);}catch(e){process.exit(2)}" >/dev/null 2>&1; then
                        report=true
                        reason="missing-package"
                      fi
                    fi

                    if [ "$report" = true ]; then
                      jq -n --arg f "$file" --arg l "$line" --arg m "$mod" --arg r "$reason" \
                        '{file:$f, line:$l, module:$m, reason:$r}' >> "$tmp"
                    fi
                done
            done
          done

          # combine lines into array (if any)
          if [ -s "$tmp" ]; then
            jq -s 'add | . as $a | ($a | map(.))' "$tmp" > "$OUT" || jq -s '.' "$tmp" > "$OUT"
          else
            jq -n '[]' > "$OUT"
          fi
          rm -f "$tmp"

          echo "=== Import scan summary ==="
          jq -r '.[] | "\(.file): \(.module) [\(.reason)]\n  -> \(.line)"' "$OUT" || true
          echo "Wrote results to $OUT"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: frontend-import-scan
          path: frontend-imports.json
