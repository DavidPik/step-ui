version: "3.9"

services:
  backend:
    image: ghcr.io/davidpik/step-ui-backend:latest
    container_name: step-ui-backend
    restart: unless-stopped
    environment:
      - STEP_CA_URL=${STEP_CA_URL}
      - STEP_CA_FINGERPRINT=${STEP_CA_FINGERPRINT}
      - STEP_CA_PROVISIONER=${STEP_CA_PROVISIONER}
    volumes:
      - backend-data:/data
    ports:
      - "9000:8080"

  frontend:
    image: ghcr.io/davidpik/step-ui-frontend:latest
    container_name: step-ui-frontend
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://backend:8080
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  backend-data:
